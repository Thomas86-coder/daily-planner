name: Supabase Keepalive

# 옛 Supabase 프로젝트(daily-planner)가 비활동으로 자동 정지되는 것을 막기 위해
# 3일마다 REST 루트에 요청을 보낸다. anon key는 index.html에 공개된 값이다.
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST root
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4cWtwZ2tpdXpkdmtkaWVxeW5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MjI3OTAsImV4cCI6MjA5MDI5ODc5MH0.T6FT8YQKAPwIgPfKU1guaRx-izWvta7fM1nLMuzggZI" \
            "https://qxqkpgkiuzdvkdieqynf.supabase.co/rest/v1/"
