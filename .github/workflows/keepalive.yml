name: Supabase Keepalive

# 옛 Supabase 프로젝트(daily-planner)가 비활동으로 자동 정지되는 것을 막기 위해
# 3일마다 실제 테이블에 가벼운 SELECT 요청을 보내 DB 활동을 발생시킨다.
# anon key는 SUPABASE_ANON_KEY 시크릿으로 주입한다.
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase table
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "https://qxqkpgkiuzdvkdieqynf.supabase.co/rest/v1/ai_reviews?select=id&limit=1"
